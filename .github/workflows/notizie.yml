name: Notizie

on:
  schedule:
    - cron: "*/10 * * * *"     # ogni 10 minuti
  workflow_dispatch:            # e quando premi tu "Run workflow"

permissions:
  contents: write

concurrency:
  group: notizie
  cancel-in-progress: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica le notizie
        run: python fetch_news.py

      - name: Salva notizie.json
        run: |
          git config user.name  "goalhubzone-bot"
          git config user.email "bot@users.noreply.github.com"
          git add notizie.json
          git diff --staged --quiet || git commit -m "notizie $(date -u +%H:%M)"
          git push
