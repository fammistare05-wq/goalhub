<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0A0A0A;color:#F2EFE6;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}

/* barra in alto */
.top{position:sticky;top:0;z-index:20;background:#0A0A0A;border-bottom:2px solid #D9A93A;
  padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.top h1{margin:0 0 10px;font-size:19px;letter-spacing:.5px}
.top h1 span{color:#D9A93A}
.tabs{display:flex;gap:4px}
.tab{flex:1;text-align:center;padding:12px 4px;font-size:14px;font-weight:700;color:#7E7466;
  border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:#D9A93A;border-bottom-color:#D9A93A}

.pane{display:none;padding:16px}
.pane.on{display:block}

label{display:block;font-size:11px;color:#9C9285;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.6px}
input,textarea,select{width:100%;padding:14px;background:#141210;border:1px solid #3A3227;
  border-radius:12px;color:#F2EFE6;font-size:16px;font-family:inherit}
input:focus{outline:none;border-color:#D9A93A}
button{background:#D9A93A;color:#0A0A0A;border:0;padding:15px 18px;border-radius:12px;
  font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
button.ghost{background:#141210;color:#C7BCA8;border:1px solid #3A3227}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1;min-width:132px}
.hint{color:#8A8071;font-size:13px;margin:8px 0 0}

.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;padding:9px 15px;border:1px solid #3A3227;border-radius:22px;
  font-size:14px;color:#C7BCA8;flex:0 0 auto}
.chip.on{background:#D9A93A;color:#0A0A0A;border-color:#D9A93A;font-weight:700}

.news{margin-top:6px}
.n{padding:15px;border:1px solid #241F18;background:#121010;border-radius:13px;margin-bottom:9px}
.n:active{border-color:#D9A93A}
.n b{display:block;font-weight:600;font-size:15px;line-height:1.35;margin-bottom:5px}
.n i{color:#8A8071;font-style:normal;font-size:12px}
.n .flag{float:right;margin-left:8px}
.n .when{color:#6E665A;font-size:11px}

canvas{width:100%;border-radius:12px;display:block}
pre{white-space:pre-wrap;background:#141210;border:1px solid #2A251C;border-radius:12px;
  padding:14px;font:14px/1.6 inherit;color:#C7BCA8;margin:12px 0 0}

#msg{font-size:13px;margin-top:10px;min-height:18px}
.ok{color:#6FCB8B}.err{color:#D98A7A}
#diag{margin-top:10px;font:12px/1.7 ui-monospace,monospace;background:#141210;
  border:1px solid #2A251C;border-radius:10px;padding:11px;max-height:200px;overflow:auto}
#diag .y{color:#6FCB8B}#diag .n{color:#B8756A;padding:0;border:0;margin:0;background:none}
.photos{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.photos img{width:82px;height:82px;object-fit:cover;border-radius:10px;border:2px solid #3A3227}
.photos .none{color:#8A8071;font-size:13px}
.warn{background:#2A2116;border:1px solid #5A4520;border-radius:10px;padding:11px;
  font-size:13px;color:#E8CB90;margin-top:12px;display:none}
.chk{display:flex;align-items:center;gap:9px;margin:14px 0 0;font-size:14px;color:#C7BCA8;text-transform:none;letter-spacing:0}
.chk input{width:22px;height:22px}

/* barra azioni in fondo */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.97);
  border-top:1px solid #2A251C;padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  display:flex;gap:8px;backdrop-filter:blur(10px)}
.bar button{flex:1;min-width:0;font-size:14px;padding:15px 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:#D9A93A;color:#0A0A0A;font-weight:700;font-size:14px;padding:11px 20px;border-radius:22px;
  opacity:0;transition:.25s;pointer-events:none;z-index:40}
#toast.on{opacity:1}
.steps{counter-reset:s;padding:0;list-style:none;margin:14px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 36px;font-size:14px;color:#C7BCA8}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;
  background:#D9A93A;color:#0A0A0A;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.steps b{color:#F2EFE6}
</style>
</head>

function ago(d){
  if(!d)return"";
  const m=Math.round((Date.now()-d)/60000);
  if(m<60)return m+" min fa";
  if(m<1440)return Math.round(m/60)+" h fa";
  return Math.round(m/1440)+" g fa";
}

function parseXML(txt,name,cc,flag){
  const xml=new DOMParser().parseFromString(txt,"text/xml");
  const nodes=xml.querySelectorAll("item, entry");
  const out=[];
  nodes.forEach(it=>{
    const t=((it.querySelector("title")||{}).textContent||"").trim();
    const d=((it.querySelector("description, summary, content")||{}).textContent||"")
             .replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    const pd=((it.querySelector("pubDate, published, updated")||{}).textContent||"");
    if(t) out.push({title:t,desc:d.slice(0,190),src:name,cc:cc,flag:flag,when:pd?Date.parse(pd):0});
  });
  return out;
}
function keep(n){
  const el=document.getElementById("tutte");
  if(el&&el.checked)return true;              // nessun filtro: prende tutto
  return KEYS.some(k=>(n.title+" "+n.desc).toLowerCase().includes(k));
}

async function grab(feed,report){
  const [name,url,cc,flag]=feed;
  for(const px of PROXIES){
    try{
      const ctrl=new AbortController();
      const to=setTimeout(()=>ctrl.abort(),12000);
      const r=await fetch(px.u(url),{cache:"no-store",signal:ctrl.signal});
      clearTimeout(to);
      if(!r.ok){continue}
      let items=[];
      if(px.t==="json"){
        const j=await r.json();
        if(j.status!=="ok"||!j.items) continue;
        items=j.items.map(i=>({title:(i.title||"").trim(),
          desc:(i.description||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,190),
          src:name,cc:cc,flag:flag,when:i.pubDate?Date.parse(i.pubDate):0}));
      }else if(px.t==="wrap"){
        const j=await r.json();
        items=parseXML(j.contents||"",name,cc,flag);
      }else{
        items=parseXML(await r.text(),name,cc,flag);
      }
      items=items.filter(i=>i.title&&keep(i));
      if(items.length){report.push({name:name,ok:true,via:px.n,n:items.length});return items}
    }catch(e){}
  }
  report.push({name:name,ok:false});
  return [];
}

}

async function loadNews(){
  const btn=document.getElementById("load");
  btn.disabled=true; msg("Sto leggendo "+FEEDS.length+" testate… (fino a 30 secondi)");
  const report=[];
  const res=await Promise.allSettled(FEEDS.map(f=>grab(f,report)));
  let items=[];
  res.forEach(r=>{if(r.status==="fulfilled")items=items.concat(r.value)});
  btn.disabled=false;

  document.getElementById("diag").innerHTML=report
    .sort((a,b)=>(b.ok?1:0)-(a.ok?1:0))
    .map(r=>r.ok?`<div class="y">OK &nbsp;${r.name} — ${r.n} notizie (via ${r.via})</div>`
                : `<div class="n">KO &nbsp;${r.name}</div>`).join("");

  const okN=report.filter(r=>r.ok).length;

  if(!items.length){
    msg("Nessuna testata raggiungibile — resto sulle notizie di riserva. Clicca \"Dettagli\" per vedere cosa ha fallito.","err");
    document.getElementById("diag").style.display="block";
    return;
  }
  const seen=new Set();
  items=items.filter(n=>{
    const k=n.title.toLowerCase().replace(/[^a-z0-9 ]/g,"").split(" ").sort().join("");
    if(seen.has(k))return false; seen.add(k); return true;
  }).sort((a,b)=>b.when-a.when).slice(0,400);

  allItems=items;
  msg("Aggiornate: "+items.length+" notizie da "+okN+" testate su "+FEEDS.length,"ok");
  renderNews();
}

function renderNews(){
  const q=(document.getElementById("q").value||"").toLowerCase();
  const list=allItems.filter(n=>(area==="all"||n.cc===area)&&(!q||(n.title+" "+n.desc).toLowerCase().includes(q)));

  if(!list.length){box.innerHTML='<p class="hint">Nessuna notizia con questo filtro.</p>';return}
  box.innerHTML=list.map((n,i)=>{
    const idx=allItems.indexOf(n);
    return `<div class="n" onclick="pick(${idx})"><span class="flag">${n.flag}</span>
      <b>${esc(n.title)}</b><i>${esc(n.src)}</i> <span class="when">${ago(n.when)}</span></div>`;
  }).join("");
}

function esc(s){return s.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}

let credit=null;

const NO_FOTO=/logo|crest|badge|stemma|stadi|stadium|arena|coat of arms|flag|bandiera|trophy|troph|map|mappa|jersey|maglia|kit|signature|autograf|banner|ticket|tifos|fans|crowd|graffiti|scudetto|escudo|wappen/i;

async function wikiRitratto(lang,nome,parola){
  const api="https://"+lang+".wikipedia.org/w/api.php?action=query&format=json&origin=*"+
    "&generator=search&gsrlimit=3&gsrsearch="+encodeURIComponent(nome+" "+parola)+
    "&prop=pageimages&piprop=original|thumbnail&pithumbsize=1200";
  const out=[];
  try{
    const j=await (await fetch(api)).json();
    Object.values((j.query||{}).pages||{}).forEach(pg=>{
      const u=(pg.original||{}).source||(pg.thumbnail||{}).source;
      if(!u||NO_FOTO.test(u))return;
      if(/\.svg$/i.test(u))return;
      out.push({url:u,etichetta:"Wikipedia "+lang.toUpperCase(),punti:100});
    });
  }catch(e){}
  return out;
}

async function commonsFoto(nome){
  const cognome=(nome.split(/\s+/).pop()||nome).toLowerCase();
  const api="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*"+
    "&generator=search&gsrnamespace=6&gsrlimit=20&gsrsearch="+
    encodeURIComponent('filetype:bitmap "'+nome+'"')+
    "&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1200";
  const out=[];
  try{
    const j=await (await fetch(api)).json();
    Object.values((j.query||{}).pages||{}).forEach(pg=>{
      const info=(pg.imageinfo||[])[0]; if(!info)return;
      const titolo=pg.title||"";
      if(NO_FOTO.test(titolo))return;
      if(!titolo.toLowerCase().includes(cognome))return;      // deve nominarlo davvero
      if((info.width||0)<600)return;                          // niente miniature scadenti
      const meta=info.extmetadata||{};
      out.push({
        url:info.thumburl||info.url,
        etichetta:"Commons",
        autore:((meta.Artist||{}).value||"").replace(/<[^>]+>/g,"").trim().slice(0,38),
        licenza:((meta.LicenseShortName||{}).value||"").trim(),
        punti: (info.height>info.width?40:15)                 // i ritratti verticali vengono meglio
      });
    });
  }catch(e){}
  return out;
}

async function cercaFoto(){
  const box=document.getElementById("photos");
  let q=(document.getElementById("pq").value||"").trim();
  if(!q){q=document.getElementById("ghost").value||"";document.getElementById("pq").value=q}
  if(!q){box.innerHTML='<span class="none">Scrivi il nome del giocatore.</span>';return}
  box.innerHTML='<span class="none">Cerco il ritratto migliore…</span>';

  const gruppi=await Promise.all([
    wikiRitratto("it",q,"calciatore"),
    wikiRitratto("en",q,"footballer"),
    commonsFoto(q)
  ]);
  let res=[].concat.apply([],gruppi);

  // niente doppioni, i migliori davanti
  const visti=new Set();
  res=res.filter(r=>{const k=r.url.split("/").pop();if(visti.has(k))return false;visti.add(k);return true})
         .sort((a,b)=>b.punti-a.punti).slice(0,8);

  if(!res.length){
    box.innerHTML='<span class="none">Nessuna foto libera per "'+q+'". Prova col nome completo (es. "John Stones"), oppure carica una tua immagine qui sotto.</span>';
    return;
  }
  box.innerHTML="";
  res.forEach(r=>{
    const im=document.createElement("img");
    im.src=r.url; im.crossOrigin="anonymous"; im.loading="lazy";
    im.title=r.etichetta+(r.autore?" — "+r.autore:"");
    im.onclick=()=>usaFoto(r);
    box.appendChild(im);
  });
}

async function creditoDaFile(url){
  try{
    const nome=decodeURIComponent(url.split("/").pop()).replace(/^\d+px-/,"");
    const api="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*"+
      "&titles=File:"+encodeURIComponent(nome)+"&prop=imageinfo&iiprop=extmetadata";
    const j=await (await fetch(api)).json();
    const pg=Object.values((j.query||{}).pages||{})[0]||{};
    const meta=((pg.imageinfo||[])[0]||{}).extmetadata||{};
    const a=((meta.Artist||{}).value||"").replace(/<[^>]+>/g,"").trim().slice(0,38);
    const l=((meta.LicenseShortName||{}).value||"").trim();
    if(a||l)return "Foto: "+(a||"Wikimedia")+(l?" / "+l:"")+" — Wikimedia Commons";
  }catch(e){}
  return "Foto: Wikimedia Commons";
}

function usaFoto(r){
  const im=new Image();
  im.crossOrigin="anonymous";
  im.onload=async()=>{
    photoImg=im;
    credit = (r.autore||r.licenza)
      ? ("Foto: "+(r.autore||"Wikimedia")+(r.licenza?" / "+r.licenza:"")+" — Wikimedia Commons").slice(0,80)
      : "Foto: Wikimedia Commons";

  im.onerror=()=>{document.getElementById("photos").innerHTML='<span class="none">Immagine non caricabile, provane un\'altra.</span>'};
  im.src=r.url;
}

async function translate(text){
  if(!text)return null;
  const api="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=it&dt=t&q="+encodeURIComponent(text);
  const routes=[
    u=>u,                                                        // diretto
    u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
    u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)
  ];
  for(const r of routes){
    try{
      const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),9000);
      const res=await fetch(r(api),{signal:ctrl.signal}); clearTimeout(to);
      if(!res.ok)continue;
      let t=(await res.text()).trim();
      if(t.startsWith('{"contents"'))t=JSON.parse(t).contents;
      const j=JSON.parse(t);
      const out=(j[0]||[]).map(x=>x[0]).filter(Boolean).join("").trim();
      if(out)return out;
    }catch(e){}
  }
  return null;
}

function transferPair(blob){
  const found=CLUBS.filter(c=>new RegExp("\\b"+c+"\\b","i").test(blob));
  if(found.length<2)return"";
  // chi e' preceduto da "from / dal / dallo / vom / du" e' la squadra di partenza
  const orig=found.find(c=>new RegExp("(from|dal|dallo|dalla|proveniente da|dell'|vom|von|aus dem|du|procedente del)\\s+(the\\s+|l'|il\\s+|lo\\s+)?"+c,"i").test(blob));
  // chi e' preceduto da "al / allo / verso / joins" e' la squadra di arrivo
  // "80 milioni AL Newcastle" = soldi a chi vende: quello e' il club di partenza
  const paid=found.find(c=>new RegExp("(milion\\w*|euro|sterline|€|£)[^.]{0,18}(al|allo|alla|ai)\\s+"+c,"i").test(blob));
  const dest=paid?null:found.find(c=>new RegExp("(al|allo|alla|ai|per il|per la|verso il|verso la|joins|to the)\\s+"+c,"i").test(blob));
  if(paid){const other=found.find(c=>c!==paid)||found[1];return paid.toUpperCase()+" → "+other.toUpperCase()}
  let a,b;
  if(orig){a=orig; b=found.find(c=>c!==orig)||found[1];}
  else if(dest){b=dest; a=found.find(c=>c!==dest)||found[0];}
  else {a=found[0]; b=found[1];}
  return a.toUpperCase()+" → "+b.toUpperCase();
}
function nomeCompleto(title){
  const t=title.replace(/^[^:]{0,20}:\s*/,"");
  const clubWords=new Set(CLUBS.join(" ").toLowerCase().split(" "));
  const cap="[A-ZÀ-Ý][a-zà-ÿ'\u2019]{2,}";
  const pairs=t.match(new RegExp(cap+"\\s+"+cap,"g"))||[];
  for(const pr of pairs){
    const w=pr.split(/\s+/);
    if(w.some(x=>clubWords.has(x.toLowerCase())))continue;
    return pr;
  }
  return "";
}
function surname(title){
  const t=title.replace(/^[^:]{0,20}:\s*/,"");
  const clubWords=new Set(CLUBS.join(" ").toLowerCase().split(" "));
  const cap="[A-ZÀ-Ý][a-zà-ÿ'\u2019]{2,}";
  // 1) coppia Nome Cognome -> tieni il cognome
  const pairs=t.match(new RegExp(cap+"\\s+"+cap,"g"))||[];
  for(const pr of pairs){
    const w=pr.split(/\s+/);
    if(w.some(x=>clubWords.has(x.toLowerCase())))continue;
    return w[1].toUpperCase();
  }
  // 2) altrimenti la prima parola maiuscola non-club
  const one=(t.match(new RegExp(cap,"g"))||[]).find(w=>!clubWords.has(w.toLowerCase()));
  return one?one.toUpperCase():"";
}

/* ---------- GRAFICA ---------- */
function wrap(ctx,text,max){
  const out=[];let line="";
  for(const w of text.split(/\s+/)){
    const t=(line+" "+w).trim();
    if(ctx.measureText(t).width<=max){line=t}else{if(line)out.push(line);line=w}
  }
  if(line)out.push(line);return out;
}
function fit(ctx,text,max,maxLines,start,min,weight){
  let s=start;
  while(s>min){ctx.font=weight+" "+s+'px system-ui,"Segoe UI",Arial,sans-serif';
    const l=wrap(ctx,text,max); if(l.length<=maxLines)return{size:s,lines:l}; s-=4}
  ctx.font=weight+" "+min+'px system-ui,"Segoe UI",Arial,sans-serif';
  return{size:min,lines:wrap(ctx,text,max).slice(0,maxLines)};
}

function draw(){
  const c=document.getElementById("cv"),x=c.getContext("2d");
  const head=(document.getElementById("head").value||"").toUpperCase();
  const sub=document.getElementById("sub").value||"";
  const gh=(document.getElementById("ghost").value||"").toUpperCase();
  const tr=document.getElementById("tr").value||"";
  const brand=(document.getElementById("brand").value||"CALCIOMERCATO").toUpperCase();
  const handle=document.getElementById("handle").value||"@goalhubzone";

  x.fillStyle=BG; x.fillRect(0,0,W,H);

  if(photoImg){
    const ph=Math.round(H*.70);
    const r=Math.max(W/photoImg.width,ph/photoImg.height);
    const nw=photoImg.width*r,nh=photoImg.height*r;
    const bias = photoImg.height>photoImg.width ? .05 : .18;
    x.save();
    x.beginPath(); x.rect(0,0,W,ph); x.clip();      // la foto NON esce dalla sua fascia
    x.drawImage(photoImg,(W-nw)/2,-(nh-ph)*bias,nw,nh);
    x.fillStyle="rgba(217,169,58,.14)"; x.fillRect(0,0,W,ph);
    x.fillStyle="rgba(0,0,0,.22)"; x.fillRect(0,0,W,ph);
    const g=x.createLinearGradient(0,ph*.36,0,ph);  // sfuma fino al nero pieno
    g.addColorStop(0,"rgba(10,10,10,0)");
    g.addColorStop(.55,"rgba(10,10,10,.72)");
    g.addColorStop(1,BG);
    x.fillStyle=g; x.fillRect(0,0,W,ph);
    x.restore();
    x.fillStyle=BG; x.fillRect(0,ph,W,H-ph);        // sotto: nero pieno, testo sempre leggibile
  }else{
    const g=x.createRadialGradient(W/2,H*.28,60,W/2,H*.28,780);
    g.addColorStop(0,"rgba(217,169,58,.30)"); g.addColorStop(1,"rgba(10,10,10,0)");
    x.fillStyle=g; x.fillRect(0,0,W,H);
    if(gh){
      const f=fit(x,gh,W+260,1,235,90,"800");
      x.font="800 "+f.size+'px system-ui,"Segoe UI",Arial,sans-serif';
      x.fillStyle="rgba(217,169,58,.16)"; x.textAlign="center";
      x.fillText(f.lines[0],W/2,H*.34);
    }
    if(tr){
      x.font='800 42px system-ui,"Segoe UI",Arial,sans-serif';
      x.fillStyle=GOLD; x.textAlign="center"; x.fillText(tr,W/2,H*.46);
    }
  }
  x.textAlign="left";

  /* pillola */
  x.font='700 30px system-ui,"Segoe UI",Arial,sans-serif';
  const pw=x.measureText(brand).width;
  x.fillStyle=GOLD;
  if(x.roundRect){x.beginPath();x.roundRect(M,62,pw+56,70,35);x.fill()}
  else x.fillRect(M,62,pw+56,70);
  x.fillStyle=BG; x.fillText(brand,M+28,107);

  /* credito foto, piccolo in fondo */
  if(credit){
    x.font='400 20px system-ui,"Segoe UI",Arial,sans-serif';
    x.fillStyle="#7E7466"; x.fillText(credit,M,H-42);
  }

  /* @ GRANDE dentro una pillola oro */
  x.font='800 42px system-ui,"Segoe UI",Arial,sans-serif';
  const hw=x.measureText(handle).width;
  const py=credit?H-186:H-172;
  x.fillStyle=GOLD;
  if(x.roundRect){x.beginPath();x.roundRect(M,py,hw+52,68,34);x.fill()}
  else x.fillRect(M,py,hw+52,68);
  x.fillStyle=BG; x.fillText(handle,M+26,py+48);

  let y=py-42;

  if(sub){
    x.font='400 34px system-ui,"Segoe UI",Arial,sans-serif'; x.fillStyle="#C9C0AE";
    const l=wrap(x,sub,W-2*M).slice(0,2);
    for(let i=l.length-1;i>=0;i--){x.fillText(l[i],M,y);y-=46}
    y-=12;
  }
  const f=fit(x,head,W-2*M,3,92,52,"800");
  x.font="800 "+f.size+'px system-ui,"Segoe UI",Arial,sans-serif';
  x.fillStyle="#FFFFFF";
  const lh=Math.round(f.size*1.06);
  for(let i=f.lines.length-1;i>=0;i--){x.fillText(f.lines[i],M,y);y-=lh}

  const bg=x.createLinearGradient(M,0,M+130,0);
  bg.addColorStop(0,"#7A5F22"); bg.addColorStop(1,"#F0C766");
  x.fillStyle=bg; x.fillRect(M,y-36,130,9);

  x.strokeStyle=GOLD; x.lineWidth=6; x.strokeRect(0,0,W,H);

  caption();
}

/* ---------- DIDASCALIA ---------- */
function caption(){
  const head=document.getElementById("head").value||"";
  const sub=document.getElementById("sub").value||"";
  const src=document.getElementById("src").value||"";
  const blob=(head+" "+sub).toLowerCase();
  const tags=["#calciomercato","#seriea","#calcio","#transfernews","#mercato"];
  CLUBS.forEach(c=>{if(blob.includes(c.toLowerCase())){const t="#"+c.toLowerCase().replace(/[^a-z]/g,"");if(!tags.includes(t))tags.push(t)}});
  const gh=document.getElementById("ghost").value;
  if(gh&&gh.length>4){const t="#"+gh.toLowerCase().replace(/[^a-z]/g,"");if(!tags.includes(t))tags.push(t)}
  let t="🚨 "+head.charAt(0)+head.slice(1).toLowerCase();
  if(sub)t+="\n\n"+sub;
  t+="\n\nChe ne pensi? 👇 Commenta";
  if(src)t+="\n\n📰 Fonte: "+src;
  t+="\n\n"+tags.slice(0,14).join(" ");
  document.getElementById("cap").textContent=t;
}

}

function vai(i){

function toast(t){
  const el=document.getElementById("toast");

  clearTimeout(window._tt); window._tt=setTimeout(()=>el.classList.remove("on"),2200);
}

async function condividi(){
  const cv=document.getElementById("cv");
  const testo=document.getElementById("cap").textContent;
  try{ await navigator.clipboard.writeText(testo); }catch(e){}
  cv.toBlob(async blob=>{
    if(!blob){toast("Errore immagine");return}
    const file=new File([blob],"goalhubzone.jpg",{type:"image/jpeg"});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        toast("Didascalia già copiata");
      }else{
        download(); toast("Condivisione non disponibile: immagine salvata");
      }
    }catch(e){ if(e.name!=="AbortError") toast("Condivisione annullata"); }
  },"image/jpeg",.94);
}
